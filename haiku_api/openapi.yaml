openapi: 3.0.0
info:
  title: Haiku
  version: 1.0.0
servers:
  - url: http://192.168.3.12:8080/v1
paths:
  /haikus:
    get:
      tags:
        - haikus
      summary: "俳句情報API"
      description: "投稿された俳句の一覧を返します"
      parameters:
        - name: "keyword"
          in: query
          description: "検索したいキーワード"
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A JSON array of Haiku model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Haiku"
    post:
      tags:
        - haikus
      summary: 俳句投稿API
      description: 俳句を投稿します
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                content:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haiku"
      security:
        - bearer: []
  /users:
    post:
      tags:
        - users
      description: ユーザを登録します
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                emailAdress:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
    Haiku:
      type: object
      properties:
        id:
          type: integer
        userPost:
          $ref: "#/components/schemas/User"
        content:
          type: string
        created_at:
          type: string
          description: "フォーマット: yyyy/mm/dd"
        good:
          type: array
          description: "この投稿をいいねしたユーザー一覧"
          items:
            $ref: "#/components/schemas/User"
