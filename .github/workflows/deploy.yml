name: Deploy App

on:
  push:
    branches: [master]
    paths:
      - 'haiku_front/**'
      - 'haiku_server/**'
      - 'Dockerfile.prod'
      - 'infra/modules/lambda_thumbnail/docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  # バックエンド(pytest)・フロントエンド(Vitest)のテストを実行する。
  # ここが失敗すると、後続のterraform-outputs以降(=実際のデプロイ作業)は
  # 一切実行されない(needs: test で直列につないでいるため)。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: バックエンドの依存パッケージをインストール
        run: pip install -r haiku_server/requirements.txt -r haiku_server/requirements-dev.txt

      - name: バックエンドのテスト(pytest)
        working-directory: haiku_server
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: フロントエンドの依存パッケージをインストール
        working-directory: haiku_front
        run: npm ci --legacy-peer-deps

      - name: フロントエンドのテスト(Vitest)
        working-directory: haiku_front
        run: npm run test:unit

  terraform-outputs:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      frontend_bucket: ${{ steps.tf.outputs.frontend_bucket }}
      media_bucket: ${{ steps.tf.outputs.media_bucket }}
      cloudfront_domain: ${{ steps.tf.outputs.cloudfront_domain }}
      cloudfront_distribution_id: ${{ steps.tf.outputs.cloudfront_distribution_id }}
      ecr_backend_url: ${{ steps.tf.outputs.ecr_backend_url }}
      ecr_thumbnail_url: ${{ steps.tf.outputs.ecr_thumbnail_url }}
      ecs_cluster: ${{ steps.tf.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf.outputs.ecs_service }}
      ecs_task_family: ${{ steps.tf.outputs.ecs_task_family }}
      thumbnail_lambda_function_name: ${{ steps.tf.outputs.thumbnail_lambda_function_name }}
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - run: terraform init

      # terraform apply はしない（それはinfra.ymlの役割）。
      # 既にapply済みのstateからリソース名・URLだけを読み出す。
      - id: tf
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_id)" >> "$GITHUB_OUTPUT"
          echo "media_bucket=$(terraform output -raw media_bucket_id)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "ecr_backend_url=$(terraform output -raw ecr_backend_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_thumbnail_url=$(terraform output -raw ecr_thumbnail_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "ecs_task_family=$(terraform output -raw ecs_task_family)" >> "$GITHUB_OUTPUT"
          echo "thumbnail_lambda_function_name=$(terraform output -raw thumbnail_lambda_function_name)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: terraform-outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: haiku_front
        run: npm ci --legacy-peer-deps

      - working-directory: haiku_front
        env:
          # CloudFrontの単一ドメイン配下に/api/等もまとめているので、
          # フロントは相対パスでAPIを呼べる(=同一オリジン)。
          VUE_APP_API_BASE_URL: ""
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws s3 sync haiku_front/dist "s3://${{ needs.terraform-outputs.outputs.frontend_bucket }}" --delete

      - run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.terraform-outputs.outputs.cloudfront_distribution_id }}" \
            --paths "/*"

  backend:
    needs: terraform-outputs
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: build
        env:
          ECR_URL: ${{ needs.terraform-outputs.outputs.ecr_backend_url }}
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          docker build -f Dockerfile.prod -t "$ECR_URL:$TAG" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:$TAG"
          docker push "$ECR_URL:latest"
          echo "image=$ECR_URL:$TAG" >> "$GITHUB_OUTPUT"

  migrate:
    needs: [terraform-outputs, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: タスク定義を新イメージ+migrateコマンドに書き換えて1回だけ実行
        run: |
          CLUSTER="${{ needs.terraform-outputs.outputs.ecs_cluster }}"
          SERVICE="${{ needs.terraform-outputs.outputs.ecs_service }}"
          FAMILY="${{ needs.terraform-outputs.outputs.ecs_task_family }}"
          IMAGE="${{ needs.backend.outputs.image }}"

          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition' > task-def.json

          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].command = ["python", "manage.py", "migrate", "--noinput"]
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].networkConfiguration' --output json > netconf.json

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$NEW_ARN" \
            --network-configuration file://netconf.json \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "migrateタスクが失敗しました (exitCode=$EXIT_CODE)"
            exit 1
          fi

  deploy-service:
    needs: [terraform-outputs, backend, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 新イメージでタスク定義の新リビジョンを登録し、サービスを更新
        run: |
          CLUSTER="${{ needs.terraform-outputs.outputs.ecs_cluster }}"
          SERVICE="${{ needs.terraform-outputs.outputs.ecs_service }}"
          FAMILY="${{ needs.terraform-outputs.outputs.ecs_task_family }}"
          IMAGE="${{ needs.backend.outputs.image }}"

          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition' > task-def.json

          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.containerDefinitions[0].command)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json

          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

  thumbnail-lambda:
    needs: terraform-outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - env:
          ECR_URL: ${{ needs.terraform-outputs.outputs.ecr_thumbnail_url }}
        run: |
          docker build -t "$ECR_URL:latest" infra/modules/lambda_thumbnail/docker
          docker push "$ECR_URL:latest"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$(echo "$ECR_URL" | cut -d/ -f2)" \
            --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
          aws lambda update-function-code \
            --function-name "${{ needs.terraform-outputs.outputs.thumbnail_lambda_function_name }}" \
            --image-uri "${ECR_URL}@${DIGEST}"
